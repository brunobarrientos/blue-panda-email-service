[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "blue-panda-email-service"
version = "0.1.0"
description = "Send-only email service authenticated as focusedbluepanda@gmail.com"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "google-api-python-client>=2.120.0",
    "google-auth-oauthlib>=1.2.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
# Without this, running pytest from a git worktree imports gmail_service from
# whichever checkout the venv was installed against -- the MAIN one -- so the
# suite silently tests code you are not editing and reports green. That happened
# while fixing the 2026-08-10 thread-safety bug: a patched worktree kept failing
# because pytest was reading main's source the whole time.
pythonpath = ["src"]
testpaths = ["tests"]
